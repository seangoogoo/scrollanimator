<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScrollAnimator Callback Test</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            height: 300vh; /* Make page scrollable */
        }
        .spacer {
            height: 100vh;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box {
            width: 100px;
            height: 100px;
            background: #3498db;
            margin: 50px auto;
            border-radius: 8px;
        }
        /* Simple fade-up for testing */
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.5s, transform 0.5s;
        }
        .animate-on-scroll.aos-visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="spacer">
        <h1>Scroll Down</h1>
    </div>

    <div class="box animate-on-scroll" id="box1">Box 1</div>
    <div class="box animate-on-scroll" id="box2">Box 2</div>
    <div class="box animate-on-scroll" id="box3">Box 3</div>

    <div class="spacer">
        <h1>End</h1>
    </div>

    <script src="scroll-animator.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const animator = new ScrollAnimator({
                debug: true,
                onTransitionStart: (element) => {
                    console.log(`🚀 Start: ${element.id}`);
                    element.style.backgroundColor = '#e74c3c'; // Change color on start
                },
                onTransitionEnd: (element) => {
                    console.log(`🏁 End: ${element.id}`);
                    element.style.backgroundColor = '#2ecc71'; // Change color on end
                }
            });
            animator.init();
        });
    </script>
</body>
</html>
